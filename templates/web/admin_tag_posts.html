{{template "admin_header" .}}

        <div class="admin-header-row">
            <h1>标签：{{.Tag.Name}} <span style="font-size:0.8rem;color:var(--text-muted);">（{{.TotalPosts}} 篇文章）</span></h1>
            <a href="/admin/tags" class="btn btn--accent">← 返回标签列表</a>
        </div>

        <div class="neo-box" style="padding:0;overflow-x:auto;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>分类</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                {{range .PostCards}}
                    <tr>
                        <td class="admin-table__title">
                            <a href="/post/{{.Slug}}" target="_blank">{{.Title}}</a>
                        </td>
                        <td>{{.CategoryName}}</td>
                        <td class="admin-table__date">{{.CreatedAt | formatDate}}</td>
                        <td class="admin-table__actions">
                            <a href="/admin/posts/{{.ID}}/edit" class="btn btn--small">编辑</a>
                        </td>
                    </tr>
                {{else}}
                    <tr>
                        <td colspan="4" style="text-align:center;padding:2rem;">该标签下暂无文章。</td>
                    </tr>
                {{end}}
                </tbody>
            </table>
        </div>

{{template "admin_footer" .}}
